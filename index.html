<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <div class="user-selector">
            <label for="userSelect">Select User:</label>
            <select id="userSelect">
                <option value="">Loading users...</option>
            </select>
        </div>
        <div class="todos-container">
            <h2>Tasks for User <span id="selectedUserName"></span></h2>
            <div class="stats">
                <span>Total Tasks: <span id="totalTasks">0</span></span>
                <span>Completed: <span id="completedTasks">0</span></span>
                <span>Remaining: <span id="remainingTasks">0</span></span>
            </div>
            <ul id="todoList" class="todo-list">
                <li class="loading">Loading to-do items...</li>
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
